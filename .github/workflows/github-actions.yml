name: Pipeline CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"

jobs:

  build-and-test:
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas unitarias
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  docker-build:
    name: "Docker Build & Push"
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=branch-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # JOB 3: DEPLOY (DESACTIVADO — sin servidor remoto configurado)
  # -------------------------------------------------------------------------
  # Para activarlo en el futuro:
  #   1. Conseguir un servidor con Docker + docker-compose instalados.
  #   2. Generar par de claves SSH:
  #        ssh-keygen -t ed25519 -C "github-actions" -f ~/.ssh/gh_actions -N ""
  #   3. Copiar la clave pública al servidor:
  #        ssh-copy-id -i ~/.ssh/gh_actions.pub usuario@IP_SERVIDOR
  #   4. Crear en GitHub → Settings → Secrets and variables → Actions:
  #        SSH_HOST         = IP o hostname del servidor
  #        SSH_USER         = usuario SSH
  #        SSH_PRIVATE_KEY  = contenido de ~/.ssh/gh_actions (clave privada)
  #   5. Cambiar `if: false` por:
  #        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
  #   6. Quitar el comentario de los pasos marcados con "# DEPLOY-ACTIVO".
  #
  deploy:
    name: "Deploy a Runtime (DESACTIVADO)"
    runs-on: ubuntu-latest
    needs: docker-build
    if: false                    # <-- DESACTIVADO: sin servidor remoto

    # environment:
    #   name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # - name: Deploy via SSH                              # DEPLOY-ACTIVO
      #   uses: appleboy/ssh-action@v1                      # DEPLOY-ACTIVO
      #   with:                                             # DEPLOY-ACTIVO
      #     host: ${{ secrets.SSH_HOST }}                   # DEPLOY-ACTIVO
      #     username: ${{ secrets.SSH_USER }}               # DEPLOY-ACTIVO
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}             # DEPLOY-ACTIVO
      #     script: |                                       # DEPLOY-ACTIVO
      #       cd /opt/app                                   # DEPLOY-ACTIVO
      #       docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      #       docker compose down                           # DEPLOY-ACTIVO
      #       docker compose up -d --remove-orphans         # DEPLOY-ACTIVO
      #       docker image prune -f                         # DEPLOY-ACTIVO

      - name: Reporte final del pipeline
        if: always()
        run: |
          echo "=================================================="
          echo " Pipeline CI/CD finalizado"
          echo " Branch : ${{ github.ref_name }}"
          echo " Commit : ${{ github.sha }}"
          echo " Estado : ${{ job.status }}"
          echo " Imagen : ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "=================================================="
          echo "NOTA: El job de deploy está desactivado."
          echo "      Solo se ejecutan tests + build + push a GHCR."
